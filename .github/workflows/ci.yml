name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

  schedule:
    - cron: "0 0 * * 0"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check ESPHome release
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.esphome-release.outputs.tag }}
      tested_tag: ${{ steps.test-release.outputs.tag }}
      run_test: ${{ steps.test-conditions.outputs.run_test }}
      commit: ${{ steps.test-conditions.outputs.commit }}
      git_ref: ${{ steps.test-conditions.outputs.git_ref }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get latest ESPHome release tag
        id: esphome-release
        uses: oprypin/find-latest-tag@6957ac556fa6d349727ecabfcaaf9f8e5ee37124  # v1.1.3
        with:
          repository: esphome/esphome
          releases-only: true

      - name: Get last tested ESPHome release tag
        id: test-release
        run: |
          tag=$(jq -r '.last_tested_tag // ""' test/.test-data.json)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Should we test? Commit?
        id: test-conditions
        env:
          LATEST: ${{ steps.esphome-release.outputs.tag }}
          TESTED: ${{ steps.test-release.outputs.tag }}
          EVENT: ${{ github.event_name }}
          # Use the PR head SHA if available, otherwise fall back to the default SHA
          PR_OR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          run_test=1
          commit=0
          
          # Set the reference fallback logic
          if [[ "${EVENT}" == "pull_request" ]]; then
            git_ref="${PR_OR_SHA}"
          else
            git_ref="${{ github.ref_name }}"
          fi

          if [[ "${EVENT}" == "schedule" ]]; then
            echo "Scheduled CI. Latest=${LATEST} LastTested=${TESTED}"
            if [[ "${LATEST}" == "${TESTED}" ]]; then
              run_test=0
              echo "No change in version; skipping tests."
            else
              commit=1
            fi
          else
            echo "Commit or manual run; always test."
          fi
          
          echo "run_test=${run_test}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          # Save it so the next job can read it
          echo "git_ref=${git_ref}" >> "$GITHUB_OUTPUT" 

      - name: Display data
        run: |
          echo "Latest:      ${{ steps.esphome-release.outputs.tag }}"
          echo "Last tested: ${{ steps.test-release.outputs.tag }}"
          echo "Run test:    ${{ steps.test-conditions.outputs.run_test }}"
          echo "Commit:      ${{ steps.test-conditions.outputs.commit }}"
          echo "Git Ref:     ${{ steps.test-conditions.outputs.git_ref }}"

  ci:
    name: Building ${{ matrix.file }} / ${{ matrix.esphome-version }}
    needs: [check]
    if: needs.check.outputs.run_test != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        #### Modify below here to match your project ####
        file:
          - test/test-stusb4500-esp32-s3-idf
          - test/test-stusb4500-esp32-s3-ard
          - test/test-stusb4500-rp2
        #### Modify above here to match your project ####
        esphome-version:
          - stable
          - dev
    steps:
      - name: Checkout source code 
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: Get checked out SHA
        id: vars
        run: |
          # Extracts the full 40-character commit SHA
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          
          # Optional: Extracts the 7-character short SHA
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Use the SHA in a later step
        run: |
          echo "Full SHA is ${{ steps.vars.outputs.sha }}"
          echo "Short SHA is ${{ steps.vars.outputs.short_sha }}"
      
      - name: ESPHome ${{ matrix.esphome-version }}
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667  # v8.1.0
        with:
          substitutions: |
            ref=${{ steps.vars.outputs.sha }}
          yaml-file: ${{ matrix.file }}.yaml
          version: ${{ matrix.esphome-version }}

  commit:
    name: Commit if scheduled check
    needs: [check, ci]
    if: always() && needs.check.outputs.commit == '1' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Update tested tag in json
        env:
          LATEST: ${{ needs.check.outputs.latest_tag }}
        run: |
          tmp=$(mktemp)
          jq --arg t "$LATEST" '.last_tested_tag = $t' test/.test-data.json > "$tmp"
          mv "$tmp" test/.test-data.json
          git diff --stat

      - name: Commit and push json changes
        uses: devops-infra/action-commit-push@f066ea8e19660de57d3d3a4a0b9d294ea2612e20  # v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "Update last successfully tested ESPHome release version to ${{ needs.check.outputs.latest_tag }}"
